
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Deployment Checklist Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>(function(){var t=null;try{t=localStorage.getItem("siteTheme")}catch(e){}if(t!=="light"&&t!=="dark"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.setAttribute("data-theme",t)})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-name">GreyOrange</span></div>
    <div class="top-right">
      <span class="top-title">Deployment Checklist Tracker</span>
      <button type="button" id="selectSiteBtn" class="select-site-btn" hidden>← All sites</button>
      <button type="button" id="themeBtn" class="theme-btn"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>
  <main>
    <section class="site-section">
      <h1 class="page-title">Site Deployment Checks</h1>
      <p class="page-sub">Pick a site to start its pre and post-deployment checks.</p>
      <div class="site-search">
        <input type="text" id="searchSite" aria-label="Search site name" placeholder="Search site name" autocomplete="off">
      </div>
      <div id="list" class="site-grid"></div>
    </section>
    <section id="view"></section>
  </main>

  <div id="modal"></div>

<script>
var SITES = ["Walmart Mexico", "H&M Canada", "Sam's ATL", "DHL Figs", "Apotek", "Ryder Maryland", "Aritizia-Canada", ];
var TYPES = ["GreyMatter", "JSON", "Infra"];

var CHECKS = {
  "Walmart Mexico": {
    GreyMatter: {
      pre: [
        "Check System is idle as per-requisites",
        "Backup GM config and DB (Walmart Mexico RTP-TTP)",
        "Get sign-off from CS POC Gaurav Agrawal",
        "Confirm no VDA update running in the same week"
      ],
      post: [
        "GM services healthy on RTP and TTP",
        "Verify version reads target on both setups",
        "Orders flowing end to end on Mexico stores",
        "Watch error logs for 30 min"
      ]
    },
    JSON: {
      pre: [
        "Validate Tag JSON and map JSON against schema",
        "Diff new JSON against live Mexico copy",
        "Backup current JSON files",
        "Peer review of tag and map changes"
      ],
      post: [
        "JSON loads with no parse errors",
        "Tag and map changes visible in the UI",
        "Run a sample task using updated map",
        "Store rollback copy of previous JSON"
      ]
    },
    Infra: {
      pre: [
        "Snapshot RTP and TTP VMs",
        "Check CPU, memory and disk headroom",
        "Confirm gate controller network access",
        "Notify Mexico site stakeholders of window"
      ],
      post: [
        "All hosts reachable after update",
        "Gate controllers reconnected",
        "Monitoring and alerts active",
        "Latency and resource usage normal"
      ]
    }
  },

  "H&M Canada": {
    GreyMatter: {
      pre: [
        "Check System is idle as per-requisites",
        "Check butler core, Eureka services, Tower, MD, UI state before deployment.",
        "Check Logical Bins are also empty (Only in case of Bins idle) by TAC",
        "Check the crons running at site by TAC",
        "Check Data_sanity and data_domain should be True",
        "Take Mnesia DB, sys.config, sys.local.config, sys.infra.config backups",
        "Take Backup error desc json (Applicable for Butler Core Debian Upgrades Only)",
        "Check Builds are uploaded on server by SRE",
        "Interface image that needs to be updated is there in git hub or not (docker installation)",
        "In case of Tower update/ rabbit mq update to 3.12, OTA version needs to be updated to 2.2",
        "Sys.infra file needs to be prepared with IP changes by SRE"

      ],
      post: [
        "Restore butler error desc json (Applicable for Butler Core Debian Upgrades Only)",
        "Check failed execution for greater than equal to 1 day and resume them if any by TAC",
        "Restore nav ETS file and auto init json (Applicable for Butler Core Debian Upgrades Only)",
        "TAC to run the cron again that were running before the deployment",
        "Reinitialize the induction and extraction station in case of build deployment",
        "Check with TAC to run the post server restart script if any",
        "Check config diff and revert to the existing config which was already on the system prior to deployment",
        "Check butler core, Eureka services, Tower, MD, UI state after deployment",
        "Check data sanity post upgrade"
      ]
    },
    JSON: {
      pre: [
        "Validate JSON against schema",
        "Diff new JSON against live H&M copy",
        "Backup current JSON files",
        "Confirm change list with Branden Serrar"
      ],
      post: [
        "JSON loads with no parse errors",
        "Changes visible in the UI",
        "Run a sample task on the updated config",
        "Store rollback copy of previous JSON"
      ]
    },
    Infra: {
      pre: [
        "Snapshot RTP and TTP VMs",
        "Check OS patch level and pending reboots",
        "Verify firewall and VPN access for Canada site",
        "Confirm rollback plan and window"
      ],
      post: [
        "All hosts back after OS patching",
        "Services restarted cleanly",
        "Monitoring and alerts active",
        "Disk and memory usage normal"
      ]
    }
  },

  "Sam's ATL": {
    GreyMatter: {
      pre: [
        "Confirm current version 7.1.0.28-HF7 and target GM version",
        "Backup GM config and DB (Sam's ATL RTP-TTP)",
        "Get sign-off from CS POC Vivian Soler",
        "Confirm VDA v1.8.0 status before starting"
      ],
      post: [
        "GM services healthy on RTP and TTP",
        "Verify version reads target",
        "Confirm club order flow end to end",
        "Watch error logs for 30 min"
      ]
    },
    JSON: {
      pre: [
        "Validate JSON against schema",
        "Diff new JSON against live ATL copy",
        "Backup current JSON files",
        "Review WCS and map changes with Vivian Soler"
      ],
      post: [
        "JSON loads with no parse errors",
        "Map update and resource changes visible",
        "Run a sample task on the updated config",
        "Store rollback copy of previous JSON"
      ]
    },
    Infra: {
      pre: [
        "Snapshot RTP and TTP VMs",
        "Check resources ahead of the upgrade",
        "Verify Shuttle and network connectivity",
        "Confirm rollback plan and window"
      ],
      post: [
        "All hosts reachable",
        "Infra and Shuttle services running",
        "Monitoring and alerts active",
        "Resource usage normal after upgrade"
      ]
    }
  }
};

/* Sub-types */
var SUBTYPES = {
  JSON: {
    Map: {
      pre: ["Confirm map version and the change list", "Check map for overlapping or missing coordinates"],
      post: ["Verify the map loads and renders in the UI", "Run a test task across the changed map area"]
    },
    PPS: {
      pre: ["Confirm PPS IDs and station mapping in the JSON", "Check no tasks are active at the affected PPS"],
      post: ["Verify PPS stations are visible and reachable", "Run a sample pick/put at an affected PPS"]
    },
    Zigbee: {
      pre: ["Confirm Zigbee device IDs and channel settings", "Check the network is stable before the change"],
      post: ["Verify Zigbee devices reconnect", "Check no devices show offline after the update"]
    }
  }
};

var state = {
  site: null,
  types: {},
  subs: {},
  done: {}
};

try {
  state.done = JSON.parse(localStorage.getItem("siteChecks") || "{}");
} catch (e) {}

function save() {
  try {
    localStorage.setItem("siteChecks", JSON.stringify(state.done));
  } catch (e) {}
}

function esc(x) {
  return String(x).replace(/[&<>"]/g, function(c) {
    return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c];
  });
}

function showModal(msg) {
  document.getElementById("modal").innerHTML =
    '<div class="modal-wrap" id="modalwrap"><div class="modal"><h3>Cannot reset yet</h3><p>' +
    esc(msg) + '</p><button id="modalok">OK</button></div></div>';
}

function closeModal() {
  document.getElementById("modal").innerHTML = "";
}

/* Separate site selection and checklist screens */
function updateScreenVisibility() {
  var siteSection = document.querySelector(".site-section");
  var selectSiteBtn = document.getElementById("selectSiteBtn");
  var hasSelectedSite = !!state.site;

  if (siteSection) {
    siteSection.style.display = hasSelectedSite ? "none" : "";
  }

  if (selectSiteBtn) {
    selectSiteBtn.hidden = !hasSelectedSite;
  }

  var topTitle = document.querySelector(".top-title");
  if (topTitle) topTitle.hidden = hasSelectedSite;
}

var SITE_COLORS = ["#ffb36b", "#7dd3c0", "#b7a6ff", "#ff9fb2", "#8cc8ff", "#ffd666", "#b6e388"];

function initials(name) {
  var w = String(name).replace(/'/g, "").split(/[^A-Za-z0-9]+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "").slice(0, 2)).toUpperCase();
}

function renderList() {
  updateScreenVisibility();

  var list = document.getElementById("list");
  var searchInput = document.getElementById("searchSite");
  var searchText = searchInput ? searchInput.value.trim().toLowerCase() : "";
  list.innerHTML = SITES
    .filter(function(site) {
      return site.toLowerCase().includes(searchText);
    })
    .map(function(s) {
      return `
        <button type="button" class="site" data-s="${esc(s)}">
          <span class="ini" style="background:${SITE_COLORS[SITES.indexOf(s) % SITE_COLORS.length]}">${esc(initials(s))}</span>
          <span class="site-name">${esc(s)}</span>
        </button>
      `;
    }).join("");
}

var EXTRA = {};
try {
  EXTRA = JSON.parse(localStorage.getItem("siteChecksExtra") || "{}");
} catch (e) {}

function saveExtra() {
  try {
    localStorage.setItem("siteChecksExtra", JSON.stringify(EXTRA));
  } catch (e) {}
}

var TICKETS = {};
try {
  TICKETS = JSON.parse(localStorage.getItem("siteChecksTicket") || "{}");
} catch (e) {}

function saveTickets() {
  try {
    localStorage.setItem("siteChecksTicket", JSON.stringify(TICKETS));
  } catch (e) {}
}

function extraKey(s, t) {
  return s + "|" + t;
}

/* ---- Selection: any mix of deployment types / sub-types ---- */

function subsOf(t) {
  return SUBTYPES[t] ? Object.keys(SUBTYPES[t]) : [];
}

function resetSelection() {
  state.types = {};
  state.subs = {};
}

/* A "part" is one selected checklist: GreyMatter, Infra, or a sub-type such as JSON:Map */
function selectedParts() {
  var out = [];
  TYPES.forEach(function(t) {
    if (!state.types[t]) return;
    var subs = subsOf(t);
    if (!subs.length) {
      out.push({id: t, label: t, t: t, sub: null});
    } else {
      subs.forEach(function(n) {
        if (state.subs[t + ":" + n]) {
          out.push({id: t + ":" + n, label: t + " \u00b7 " + n, t: t, sub: n});
        }
      });
    }
  });
  return out;
}

/* Ticks and the CRN belong to the combination that is currently selected */
function comboKey() {
  return selectedParts().map(function(p) { return p.id; }).join("+");
}

function norm(t) {
  return String(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function tickKey(p, n) {
  return ["c", state.site, comboKey(), p, n].join("|");
}

function extras(s, t, p) {
  return (EXTRA[extraKey(s, t)] || []).filter(function(x) {
    return x.phase === p;
  });
}

function baseTexts(part, p) {
  var list = CHECKS[state.site][part.t][p].slice();
  if (part.sub) {
    list = list.concat(SUBTYPES[part.t][part.sub][p] || []);
  }
  return list;
}

/* Combined list for one phase. Checks with the same wording across parts are merged
   into "Common checks" */
function sections(p) {
  var parts = selectedParts();
  var groups = {}, order = [];

  parts.forEach(function(part) {
    baseTexts(part, p).forEach(function(text) {
      var n = norm(text);
      if (!groups[n]) {
        groups[n] = {text: text, parts: []};
        order.push(n);
      }
      if (groups[n].parts.indexOf(part.id) === -1) groups[n].parts.push(part.id);
    });
  });

  function row(n) {
    return {text: groups[n].text, k: tickKey(p, n)};
  }

  var out = [];
  var common = order.filter(function(n) { return groups[n].parts.length > 1; });
  if (common.length) out.push({title: "Common checks", rows: common.map(row)});

  parts.forEach(function(part) {
    var rows = order
      .filter(function(n) { return groups[n].parts.length === 1 && groups[n].parts[0] === part.id; })
      .map(row);

    extras(state.site, part.id, p).forEach(function(x) {
      rows.push({text: x.text, k: "x" + x.id, extra: 1, id: x.id, part: part.id});
    });

    if (rows.length) {
      out.push({title: parts.length > 1 ? part.label : "", rows: rows});
    }
  });

  return out;
}

function ticketBar() {
  var tk = TICKETS[extraKey(state.site, comboKey())] || "";
  return '<div class="ticketbar"><label>CRN number <input id="ticketnum" value="' +
    esc(tk) + '"></label></div>';
}

function block(p, title, sub) {
  var parts = selectedParts();
  var d = 0, total = 0, h = "";

  sections(p).forEach(function(sec) {
    if (sec.title) h += '<div class="secthead">' + esc(sec.title) + '</div>';

    sec.rows.forEach(function(it) {
      total++;
      var c = !!state.done[it.k];
      if (c) d++;

      h += '<label class="' + (c ? "done" : "") + '">' +
        '<input type="checkbox" data-k="' + esc(it.k) + '"' +
        (c ? " checked" : "") + '>' +
        '<span class="tx">' + esc(it.text) + '</span>' +
        (it.extra
          ? '<button type="button" class="xmark" title="Remove this check" data-rm="' +
            esc(it.id) + '" data-part="' + esc(it.part) + '">\u2715</button>'
          : "") +
        '</label>';
    });
  });

  var pct = total ? (100 * d / total) : 0;
  var suffix = parts.length === 1 && parts[0].sub ? " (" + esc(parts[0].sub) + ")" : "";

  return '<div class="card ' + p + '">' +
    '<div class="cardhead"><h3>' + title + suffix + '</h3><span class="cardstat">' + d + ' / ' + total + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    h + '</div>';
}

function addForm() {
  var parts = selectedParts();
  var partSelect = parts.length > 1
    ? '<select id="apart">' + parts.map(function(p) {
        return '<option value="' + esc(p.id) + '">' + esc(p.label) + '</option>';
      }).join("") + '</select>'
    : "";

  return '<div class="card addcard">' +
    '<h3>Add check</h3>' +
    '<div class="form"><select id="aphase">' +
    '<option value="pre">Pre-check</option>' +
    '<option value="post">Post-check</option></select>' +
    partSelect +
    '<input id="aref" placeholder="Ticket ID (optional)" maxlength="200">' +
    '<input id="atext" placeholder="Describe the check" maxlength="200">' +
    '<button id="asend">Add check</button></div></div>';
}

function renderView() {
  updateScreenVisibility();

  var view = document.getElementById("view");

  if (!state.site || !CHECKS[state.site]) {
    view.innerHTML = "";
    return;
  }

  var typesHTML = TYPES.map(function(type) {
    var on = !!state.types[type];
    return `
      <button type="button"
        class="${on ? "on" : ""}"
        aria-pressed="${on}"
        data-t="${esc(type)}">
        ${esc(type)}
      </button>
    `;
  }).join("");

  var subsHTML = TYPES.map(function(type) {
    var list = subsOf(type);
    if (!state.types[type] || !list.length) return "";
    return '<div class="subtypes"><span class="sublabel">' + esc(type) + ' types</span>' +
      list.map(function(n) {
        var on = !!state.subs[type + ":" + n];
        return '<button type="button" class="' + (on ? "on" : "") +
          '" aria-pressed="' + on + '" data-sub="' + esc(type + ":" + n) + '">' + esc(n) + '</button>';
      }).join("") + '</div>';
  }).join("");

  var parts = selectedParts();
  var anyType = TYPES.some(function(t) { return state.types[t]; });

  var body = !parts.length
    ? '<p class="empty">' + (anyType
        ? "<strong>Select at least one JSON type to see its checks.</strong>"
        : "Select at least one deployment type.") + '</p>'
    : `
    <div class="ticket-area">
      ${ticketBar()}
    </div>

    <div class="cols">
      ${block("pre", "Pre-checks", "Pre-deployment validation")}
      ${block("post", "Post-checks", "Post-deployment validation")}
    </div>

    <div class="reset-area">
      <button type="button" id="reset">Reset completed checklist</button>
    </div>

    ${addForm()}
  `;

  view.innerHTML = `
    <div class="crumb">${esc(state.site)} / ${esc(parts.map(function(p) { return p.label; }).join(" + ") || "Select deployment")}</div>
    <h1 class="site-title">${esc(state.site)}</h1>
    <div class="types">${typesHTML}</div>
    ${subsHTML}
    ${body}
  `;
}

document.getElementById("selectSiteBtn").addEventListener("click", function() {
  state.site = null;
  resetSelection();
  renderList();
  renderView();
});

document.getElementById("searchSite").addEventListener("input", function() {
  renderList();
});

document.addEventListener("click", function(e) {
  var s = e.target.closest("[data-s]");
  var t = e.target.closest("[data-t]");
  var sb = e.target.closest("[data-sub]");

  if (s) {
    state.site = s.dataset.s;
    resetSelection();
    renderList();
    renderView();
  } else if (t) {
    var tt = t.dataset.t;
    if (state.types[tt]) {
      delete state.types[tt];
      subsOf(tt).forEach(function(n) { delete state.subs[tt + ":" + n]; });
    } else {
      state.types[tt] = 1;
    }
    renderView();
  } else if (sb) {
    var sid = sb.dataset.sub;
    if (state.subs[sid]) delete state.subs[sid];
    else state.subs[sid] = 1;
    renderView();
  } else if (e.target.id === "reset") {
    var crn = (TICKETS[extraKey(state.site, comboKey())] || "").trim();

    if (!crn) {
      showModal("CRN number is not filled.");
      return;
    }

    var rows = [];
    ["pre", "post"].forEach(function(p) {
      sections(p).forEach(function(sec) { rows = rows.concat(sec.rows); });
    });

    var allDone = rows.every(function(it) { return !!state.done[it.k]; });

    if (!allDone) {
      showModal("All checks are not complete.");
      return;
    }

    rows.forEach(function(it) { delete state.done[it.k]; });

    save();
    delete TICKETS[extraKey(state.site, comboKey())];
    saveTickets();
    renderList();
    renderView();
  } else if (e.target.id === "modalok" || e.target.id === "modalwrap") {
    closeModal();
  } else if (e.target.id === "asend") {
    var txt = document.getElementById("atext").value.trim();
    if (!txt) return;

    var parts = selectedParts();
    if (!parts.length) return;

    var phase = document.getElementById("aphase").value;
    var ref = document.getElementById("aref").value.trim();
    var partSel = document.getElementById("apart");
    var partId = partSel ? partSel.value : parts[0].id;
    var ek = extraKey(state.site, partId);

    EXTRA[ek] = EXTRA[ek] || [];
    EXTRA[ek].push({
      id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      phase: phase,
      ref: ref,
      text: txt
    });

    saveExtra();
    renderList();
    renderView();
  } else if (e.target.dataset && e.target.dataset.rm) {
    var ek2 = extraKey(state.site, e.target.dataset.part);
    var rmid = e.target.dataset.rm;

    EXTRA[ek2] = (EXTRA[ek2] || []).filter(function(x) {
      return x.id !== rmid;
    });

    saveExtra();
    renderList();
    renderView();
  }
});

document.addEventListener("change", function(e) {
  var k = e.target.dataset && e.target.dataset.k;

  if (k) {
    if (e.target.checked) state.done[k] = 1;
    else delete state.done[k];

    save();
    renderList();
    renderView();
  }
});

document.addEventListener("input", function(e) {
  if (e.target.id === "ticketnum") {
    TICKETS[extraKey(state.site, comboKey())] = e.target.value;
    saveTickets();
    renderList();
  }
});

function updateThemeBtn() {
  var light = document.documentElement.getAttribute("data-theme") === "light";
  var btn = document.getElementById("themeBtn");
  btn.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode");
  btn.title = light ? "Switch to dark mode" : "Switch to light mode";
}

document.getElementById("themeBtn").addEventListener("click", function() {
  var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("siteTheme", next); } catch (e) {}
  updateThemeBtn();
});

updateThemeBtn();
renderList();
renderView();
</script>
</body>
</html>
